
<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login</title>
  <style>
    body {
      background-color: #f1f5f9;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .main-box {
      width: 320px;
      margin: 50px auto;
      border: 2px solid #1e293b;
      background-color: #ffffff;
    }

    .header-box {
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 18px;
    }

    .content-box {
      background-color: #e2e8f0;
      padding: 25px 20px;
    }

    table {
      width: 100%;
    }

    td {
      padding: 8px 4px;
      font-size: 14px;
      color: #1e293b;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px;
      border: 1px solid #94a3b8;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .button-container {
      text-align: center;
      margin-top: 15px;
    }

    input[type="submit"] {
      background-color: #2563eb;
      color: #ffffff;
      border: 1px solid #1d4ed8;
      padding: 8px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="reset"] {
      background-color: #64748b;
      color: #ffffff;
      border: 1px solid #475569;
      padding: 8px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer-text {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="main-box">
    <div class="header-box">
      Portal Login
    </div>
    <div class="content-box">
      <form>
        <table>
          <tr>
            <td>Username:</td>
            <td><input type="text" placeholder="Enter Username"></td>
          </tr>
          <tr>
            <td>Password:</td>
            <td><input type="password" placeholder="Enter Password"></td>
          </tr>
        </table>

        <div class="button-container">
          <input type="submit" value="Submit">
          <input type="reset" value="Reset">
        </div>

        <div class="footer-text">
          Created by: Erandio - 12 Cooper
        </div>
      </form>
    </div>
  </div>

</body>
</html>
