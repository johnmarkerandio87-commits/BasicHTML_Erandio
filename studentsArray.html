<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular Data</title>
    <script src="student.js" defer></script>
    <style>
        table {
            width: 90%;
            border-collapse: separate;
            border-spacing: 2px;
            font-family: "Times New Roman", Times, serif;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <center>
    <table border="2">
        <thead>
            <tr>
                <th>LRN</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SECTION</th>
                <th>IMAGES</th>
            </tr>
        </thead>
        <tbody id="output">
        </tbody>
    </table>
         <a href="index.html"> Home </a>
    </center>
</body>
</html>
