<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Greeting Card - Advance Merry Christmas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 2px solid #ccc;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <canvas id="cardCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("cardCanvas");
        const ctx = canvas.getContext("2d");

        function drawTree(offsetX, offsetY) {
            ctx.fillStyle = "#5c4033";
            ctx.beginPath();
            ctx.moveTo(offsetX - 10, offsetY + 60);
            ctx.lineTo(offsetX + 10, offsetY + 60);
            ctx.lineTo(offsetX + 10, offsetY + 110);
            ctx.lineTo(offsetX - 10, offsetY + 110);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#2e8b57";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY);
            ctx.lineTo(offsetX + 60, offsetY + 70);
            ctx.lineTo(offsetX - 60, offsetY + 70);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#3cb371";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 25);
            ctx.lineTo(offsetX + 45, offsetY + 30);
            ctx.lineTo(offsetX - 45, offsetY + 30);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#228b22";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 50);
            ctx.lineTo(offsetX + 30, offsetY - 5);
            ctx.lineTo(offsetX - 30, offsetY - 5);
            ctx.closePath();
            ctx.fill();
        }

        drawTree(200, 220);

        ctx.fillStyle = "#1a52b8";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "left";

        ctx.fillText("Advance Merry", 320, 210);
        ctx.fillText("Christmas!", 320, 250);

        function drawBlueCircles() {
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * 300 + 450;
                const y = Math.random() * 400 + 50;
                const radius = Math.random() * 4 + 2;

                const hue = Math.floor(Math.random() * 40) + 195;
                const lightness = Math.floor(Math.random() * 50) + 35;
                ctx.fillStyle = "hsl(" + hue + ", 85%, " + lightness + "%)";

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        drawBlueCircles();
    </script>
</body>
</html>
