<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000000;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ffffff;
    }

    .carousel {
      max-width: 800px;
      margin: 0 auto;
    }

    .slides {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
    }

    .slide {
      position: absolute;
      inset: 0;
      margin: 0;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide figcaption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 24px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .nav:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .prev {
      left: 8px;
    }

    .next {
      right: 8px;
    }

    .dots {
      text-align: center;
      padding: 12px 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      margin: 0 5px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #b8b8b8;
      cursor: pointer;
    }

    .dot.active {
      background: #0026ff;
    }
  </style>
</head>
<body>

  <h1>My Photo Gallery</h1>

  <div class="carousel" id="carousel">
    <div class="slides">
      <figure class="slide">
        <img src="883138909_1967704314206611_6325177790241922425_n.jpg" alt="Describe image 1">
        <figcaption>fLOWER</figcaption>
      </figure>
      <figure class="slide">
        <img src="883307585_938722332654744_6168822921965618132_n.jpg" alt="Describe image 2">
        <figcaption>DOG</figcaption>
      </figure>
      <figure class="slide">
        <img src="888057022_1633302318337474_7192635855720157199_n.jpg" alt="Describe image 3">
        <figcaption>IBON</figcaption>
      </figure>
      <figure class="slide">
        <img src="890376666_2279588149497518_5595446891743645328_n.jpg" alt="Describe image 4">
        <figcaption>DOGGIE</figcaption>
      </figure>

      <button class="nav prev" type="button" aria-label="Previous slide">&#10094;</button>
      <button class="nav next" type="button" aria-label="Next slide">&#10095;</button>
    </div>

    <div class="dots"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {
      const $carousel = $("#carousel");
      const $slides   = $carousel.find(".slide");
      const $dotsBox  = $carousel.find(".dots");
      const total     = $slides.length;
      const FADE_TIME = 500;  
      const DELAY     = 4000;

      let current = 0;    
      let timer   = null; 

      $slides.hide().eq(0).show();

      $slides.each(function (i) {
        $("<button>")
          .attr({ type: "button", "aria-label": "Go to slide " + (i + 1) })
          .addClass("dot" + (i === 0 ? " active" : ""))
          .data("index", i)
          .appendTo($dotsBox);
      });

      const $dots = $dotsBox.find(".dot");

      function showSlide(index) {
        if (index === current) return; 

        $slides.eq(current).stop(true, true).fadeOut(FADE_TIME);
        $slides.eq(index).stop(true, true).fadeIn(FADE_TIME);
        $dots.removeClass("active").eq(index).addClass("active");

        current = index;
      }

      function nextSlide() {
        showSlide((current + 1) % total);
      }

      function prevSlide() {
        showSlide((current - 1 + total) % total);
      }


      $carousel.on("click", ".next", nextSlide);
      $carousel.on("click", ".prev", prevSlide);

      $dotsBox.on("click", ".dot", function () {
        showSlide($(this).data("index"));
      });

      function startAutoplay() {
        stopAutoplay();
        timer = setInterval(nextSlide, DELAY);
      }

      function stopAutoplay() {
        clearInterval(timer);
      }

      $carousel
        .on("mouseenter", stopAutoplay)
        .on("mouseleave", startAutoplay);

      startAutoplay();

  
      $(document).on("keydown", function (event) {
        if (event.key === "ArrowRight") {
          nextSlide();
        } else if (event.key === "ArrowLeft") {
          prevSlide();
        }
      });
    });
  </script>
</body>
  <a href="porfolio.html" class="back-btn">← Go back to the Portfolio Page</a>
</html>
