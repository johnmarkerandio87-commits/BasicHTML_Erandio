<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="drag2.css">
    <script src="drag1.js" defer></script>

</head>
<body>
    <center>
        <h1>Sample Game Here</h1>
        <h3>Sort Them Out To Their Specific Category</h3>
    </center>

        <h4 class ="water">Drinks</h4>
    <div class = "drinks">
        <div class ="box" draggable="true" id="drinks">Coffee</div>
        <div class ="box" draggable="true" id="drinks">Red Horse</div>
        <div class ="box" draggable="true" id="drinks">Juice</div>
        <div class ="box" draggable="true" id="drinks">Water</div>
        <div class ="box" draggable="true" id="drinks">Softdrinks</div>
        <div class ="box" draggable="true" id="drinks">Gin</div>
    </div>

        <h4 class ="food">Foods</h4>
    <div class = "foods">
        <div class ="box" draggable="true" id="foods">Chicken</div>
        <div class ="box" draggable="true" id="foods">Pizza</div>
        <div class ="box" draggable="true" id="foods">Lechon</div>
        <div class ="box" draggable="true" id="foods">Bacon</div>
        <div class ="box" draggable="true" id="foods">Burger</div>
    </div>

        <h4 class ="thing">Things</h4>
    <div class = "things">
        <div class ="box" draggable="true" id="things">Cellphone</div>
        <div class ="box" draggable="true" id="things">Ear Pods</div>
        <div class ="box" draggable="true" id="things">Ballpen</div>
        <div class ="box" draggable="true" id="things">Sketch Pad</div>
    </div>

        <h4 class ="toy">Toys</h4>
    <div class = "toys">
        <div class ="box" draggable="true" id="toys">Plushie</div>
        <div class ="box" draggable="true" id="toys">Dinasour</div>
        <div class ="box" draggable="true" id="toys">Cat</div>
        <div class ="box" draggable="true" id="toys"> Duck</div>
    </div>

        <h2>Sort Them Here!!</h2>

        <div class = "droppableContainer">
        <div class ="droppable"  data-draggable-id  id="box">Beverages</div>
        <div class ="droppable"  data-draggable-id  id="box">Food</div>
        <div class ="droppable"  data-draggable-id  id="box">Things</div>
        <div class ="droppable"  data-draggable-id  id="box">Toys</div>


    </div>
<center>
  
</center>
</body> 
</html>
