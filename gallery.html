<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - John Mark R. Erandio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="gallery-container">
    <h2>Photo Gallery</h2>
    
    <!-- MANUAL SLIDER CONTAINER -->
    <div class="manual-slider">
      <div class="slider-wrapper" id="sliderWrapper">
        <div class="slide-item"><img src="image1.jpg" alt="Photo 1"></div>
        <div class="slide-item"><img src="image2.jpg" alt="Photo 2"></div>
        <div class="slide-item"><img src="image3.jpg" alt="Photo 3"></div>
        <div class="slide-item"><img src="image4.jpg" alt="Photo 4"></div>
        <div class="slide-item"><img src="image5.jpg" alt="Photo 5"></div>
      </div>

      <!-- MGA BUTTONS / ARROWS SA GILID -->
      <button class="slider-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
      <button class="slider-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-left">
        <h4>Let's Connect!</h4>
        <p>Thank you for visiting my website. Feel free to reach out for collaborations, school projects, or inquiries.</p>
      </div>
      <div class="footer-right">
        <h4>Follow Me</h4>
        <div class="social-links">
          <a href="#">FB</a>
          <a href="#">YT</a>
          <a href="#">IG</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 All Rights Reserved | Designed by: John Mark R. Erandio</p>
    </div>
  </footer>

  <!-- SIMPLE JAVASCRIPT PARA SA PAG-CLICK NG BUTTON -->
  <script>
    let currentIndex = 0;

    function moveSlide(direction) {
      const wrapper = document.getElementById('sliderWrapper');
      const totalSlides = wrapper.children.length;
      
      currentIndex += direction;

      if (currentIndex >= totalSlides) {
        currentIndex = 0; // Bumabalik sa unahan kapag umabot sa dulo
      } else if (currentIndex < 0) {
        currentIndex = totalSlides - 1; // Pumupunta sa dulo kapag pinilit sa kaliwa mula sa umpisa
      }

      wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
  </script>

</body>
</html>
