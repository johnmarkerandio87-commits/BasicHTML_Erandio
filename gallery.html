<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - John Mark R. Erandio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Karagdagang CSS para sa Coverflow Carousel */
    .coverflow-container {
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      position: relative;
    }

    .coverflow-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
      will-change: transform;
    }

    .cover-item {
      min-width: 20%;
      box-sizing: border-box;
      cursor: pointer;
      opacity: 0.5;
      transform: scale(0.85);
      transition: opacity 0.3s, transform 0.3s;
      padding: 0 10px;
    }

    .cover-item.active {
      opacity: 1;
      transform: scale(1);
    }

    .cover-item img {
      width: 100%;
      border-radius: 8px;
      display: block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="gallery-container">
    <h2>My Photo Gallery</h2>
    
    <!-- COVERFLOW / CLICKABLE GALLERY CONTAINER -->
    <div class="coverflow-container" id="coverflow">
      <div class="coverflow-track" id="track">
        <div class="cover-item active" onclick="selectSlide(0)"><img src="image1.jpg" alt="Photo 1"></div>
        <div class="cover-item" onclick="selectSlide(1)"><img src="image2.jpg" alt="Photo 2"></div>
        <div class="cover-item" onclick="selectSlide(2)"><img src="image3.jpg" alt="Photo 3"></div>
        <div class="cover-item" onclick="selectSlide(3)"><img src="image4.jpg" alt="Photo 4"></div>
        <div class="cover-item" onclick="selectSlide(4)"><img src="image5.jpg" alt="Photo 5"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-left">
        <h4>Let's Connect!</h4>
        <p>Thank you for visiting my website. Feel free to reach out for collaborations, school projects, or inquiries.</p>
      </div>
      <div class="footer-right">
        <h4>Follow Me</h4>
        <div class="social-links">
          <a href="#">FB</a>
          <a href="#">YT</a>
          <a href="#">IG</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 All Rights Reserved | Designed by: John Mark R. Erandio</p>
    </div>
  </footer>

  <!-- JAVASCRIPT PARA SA PAG-CLICK NG LITRATO -->
  <script>
    let currentIndex = 0;
    const items = document.querySelectorAll('.cover-item');
    const track = document.getElementById('track');

    function selectSlide(index) {
      currentIndex = index;
      
      // I-update ang active class sa bawat item
      items.forEach((item, i) => {
        item.classList.remove('active');
        if (i === currentIndex) {
          item.classList.add('active');
        }
      });

      // Kalkulahin ang offset para pumunta sa gitna ang napiling larawan
      const offset = 40 - (currentIndex * 20); 
      track.style.transform = `translateX(${offset}%)`;
    }
  </script>

</body>
</html>
