<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - John Mark R. Erandio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="gallery-container">
    <h2>My Photo Gallery</h2>
    
    <!-- CAROUSEL SLIDER CONTAINER -->
    <div class="carousel-container">
      <div class="carousel-slide" id="carouselSlide">
        <div class="slide-item"><img src="image1.jpg" alt="Photo 1"></div>
        <div class="slide-item"><img src="image2.jpg" alt="Photo 2"></div>
        <div class="slide-item"><img src="image3.jpg" alt="Photo 3"></div>
        <div class="slide-item"><img src="image4.jpg" alt="Photo 4"></div>
                <div class="slide-item"><img src="image5.jpg" alt="Photo 4"></div>
      </div>

      <!-- ARROW BUTTONS SA GILID -->
      <button class="arrow-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
      <button class="arrow-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <!-- DOTS INDICATORS SA ILALIM -->
    <div class="dots-container">
      <span class="dot active" onclick="currentSlide(0)"></span>
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
      <span class="dot" onclick="currentSlide(3)"></span>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-left">
        <h4>Let's Connect!</h4>
        <p>Thank you for visiting my website. Feel free to reach out for collaborations, school projects, or inquiries.</p>
      </div>
      <div class="footer-right">
        <h4>Follow Me</h4>
        <div class="social-links">
          <a href="#">FB</a>
          <a href="#">YT</a>
          <a href="#">IG</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 All Rights Reserved | Designed by: John Mark R. Erandio</p>
    </div>
  </footer>

  <!-- JAVASCRIPT PARA SA MGA ARROWS AT DOTS -->
  <script>
    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide-item');
    const dots = document.querySelectorAll('.dot');
    const slider = document.getElementById('carouselSlide');

    function updateSlider() {
      slider.style.transform = `translateX(-${slideIndex * 100}%)`;
      dots.forEach(dot => dot.classList.remove('active'));
      dots[slideIndex].classList.add('active');
    }

    function changeSlide(n) {
      slideIndex += n;
      if (slideIndex >= slides.length) {
        slideIndex = 0;
      } else if (slideIndex < 0) {
        slideIndex = slides.length - 1;
      }
      updateSlider();
    }

    function currentSlide(n) {
      slideIndex = n;
      updateSlider();
    }
  </script>

</body>
</html>
